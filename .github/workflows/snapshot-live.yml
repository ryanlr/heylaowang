name: Snapshot live heylaowang.com

on:
  push:
    branches: [main]
    paths: [".github/workflows/snapshot-live.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the live site
        run: |
          mkdir -p _live
          for p in "" "ai/" "stock_trading/"; do
            n=$(echo "root${p}" | tr '/' '_')
            curl -sS -L -A "Mozilla/5.0" -D "_live/${n}.headers" -o "_live/${n}.html" "https://heylaowang.com/${p}" || true
          done
          curl -sS -L -A "Mozilla/5.0" -D _live/www.headers -o /dev/null "https://www.heylaowang.com/" || true
          for f in favicon.ico favicon.svg robots.txt sitemap.xml apple-touch-icon.png CNAME; do
            code=$(curl -s -L -A "Mozilla/5.0" -o "_live/$f" -w "%{http_code}" "https://heylaowang.com/$f")
            [ "$code" = "200" ] || rm -f "_live/$f"
          done
          # any same-site assets referenced by the home page
          grep -oE '(src|href)="[^"#]+"' _live/root.html | sed -E 's/^(src|href)="//; s/"$//' | grep -vE '^(https?:)?//|^mailto:' | sort -u > _live/assets.txt || true
          while read -r a; do
            [ -z "$a" ] && continue
            u="https://heylaowang.com/${a#/}"; d="_live/assets/${a#/}"; mkdir -p "$(dirname "$d")"
            curl -sS -L -A "Mozilla/5.0" -o "$d" "$u" || true
          done < _live/assets.txt
          dig +short heylaowang.com > _live/dns.txt || true; dig +short www.heylaowang.com >> _live/dns.txt || true
          dig +short CNAME heylaowang.com >> _live/dns.txt || true
          ls -laR _live
      - name: Commit snapshot
        run: |
          git config user.name "snapshot-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add _live
          git commit -m "Snapshot of live heylaowang.com" || exit 0
          git push
